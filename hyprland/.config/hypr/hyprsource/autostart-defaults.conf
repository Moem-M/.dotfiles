
###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun
$browser = firefox

#################
### AUTOSTART ###
#################

#start hyprland locked
exec-once = hyprlock
# swaync is the notification daemon
exec-once = $terminal & waybar & hyprpaper & swaync & hypridle
# GUI applications being able to request elevated privileges
exec-once = systemctl --user start hyprpolkitagent
# Network Manager
exec-once = nm-applet 
# Autostart Discord in workspace 10
exec-once = [workspace 10 silent] discord
# Autostart mail client in workspace 9
exec-once = [workspace 9 silent] thunderbird
# Autostart RGB 
exec-once = openrgb 

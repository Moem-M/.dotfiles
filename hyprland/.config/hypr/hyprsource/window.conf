##############################
### WINDOWS AND WORKSPACES ###
##############################

#Attaches programs to specific workspaces
windowrule = workspace[5] silent, class:steam   
windowrule = workspace[9] silent, class:thunderbird
windowrule = workspace[10] silent, class:discord

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

workspace=1,monitor:DP-1,default:true
workspace=2,monitor:DP-2
workspace=3,monitor:DP-1
workspace=4,monitor:DP-2
workspace=5,monitor:DP-1
workspace=6,monitor:DP-2
workspace=7,monitor:DP-1
workspace=8,monitor:DP-2
workspace=9,monitor:DP-2
workspace=10,monitor:DP-2,default:true
